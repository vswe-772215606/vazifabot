[project]
name = "vazifabot"
version = "0.1.0"
description = "Oddiy vazifalar boti: Telegram'da o'zbek tilida"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["python-telegram-bot>=22.8,<23"]

[project.scripts]
vazifabot = "vazifabot.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
